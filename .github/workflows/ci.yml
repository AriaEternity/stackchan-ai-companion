name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_public.py
      - run: python -m unittest discover -s server -p 'test_*.py' -v
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure with assertions enabled
        run: cmake -S firmware/tests -B .cache/host-tests -DCMAKE_BUILD_TYPE=Debug -DPROTOCOL_EXAMPLES_DIR="$PWD/protocol/examples" -DPROTOCOL_V2_EXAMPLES_DIR="$PWD/protocol/examples-v2"
      - run: cmake --build .cache/host-tests --parallel 2
      - run: ctest --test-dir .cache/host-tests --output-on-failure
